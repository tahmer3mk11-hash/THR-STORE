<script type="module">
  // 1. استدعاء مكتبات Firebase
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  // 2. إعدادات Firebase الخاصة بك
  const firebaseConfig = {
    apiKey: "AIzaSyDO04hg5d92F7HmEcLJmczaF2AE1GGPo1g",
    authDomain: "thr-store.firebaseapp.com",
    projectId: "thr-store",
    storageBucket: "thr-store.firebasestorage.app",
    messagingSenderId: "253023759221",
    appId: "1:253023759221:web:399127c8670beef599413c"
  };

  // 3. تشغيل Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // 4. المتغيرات الأساسية
  let products = [];
  let reviews = [];
  let settings = { siteName: "THR STORE", heroTitle: "أهلاً بك", heroDesc: "أفضل متجر", themeColor: "#8e44ad", whatsapp: "966500000000", upsellProductId: null };
  let favorites = JSON.parse(localStorage.getItem('THR_favs')) || [];
  let cart = JSON.parse(localStorage.getItem('THR_Cart')) || [];
  let currentUser = JSON.parse(localStorage.getItem('THR_User')) || null;
  let activeProduct = null;
  let selectedOptionIndex = -1;
  let currentRating = 0;

  // 5. دالة الإشعارات
  function showToast(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    let icon = type === 'error' ? 'fa-circle-xmark' : type === 'warning' ? 'fa-triangle-exclamation' : 'fa-check-circle';
    toast.innerHTML = `<i class="fa-solid ${icon} toast-icon"></i> <span>${message}</span>`;
    container.appendChild(toast);
    setTimeout(() => toast.classList.add('show'), 10);
    setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
  }

  // 6. جلب البيانات من Firebase
  async function loadDataFromFirebase() {
    try {
      const settingsSnap = await getDocs(collection(db, "settings"));
      if (!settingsSnap.empty) {
        settings = settingsSnap.docs[0].data();
      } else {
        await setDoc(doc(db, "settings", "main"), settings);
      }

      const productsSnap = await getDocs(collection(db, "products"));
      products = [];
      productsSnap.forEach((doc) => {
        products.push({ id: doc.id, ...doc.data() });
      });

      const reviewsSnap = await getDocs(collection(db, "reviews"));
      reviews = [];
      reviewsSnap.forEach((doc) => {
        reviews.push({ id: doc.id, ...doc.data() });
      });

      applySettings();
      renderStore();
      updateCart();
      updateAuthUI();
      
      // إخفاء شاشة التحميل بعد جلب البيانات
      document.getElementById('preloader').classList.add('hidden');

    } catch (error) {
      console.error("خطأ في جلب البيانات: ", error);
      showToast("حدث خطأ في الاتصال بقاعدة البيانات", "error");
      document.getElementById('preloader').classList.add('hidden');
    }
  }

  // تشغيل جلب البيانات أول ما تفتح الصفحة
  loadDataFromFirebase();// 7. تطبيق الإعدادات
  function applySettings() {
    document.getElementById('siteTitle').innerText = settings.siteName;
    document.getElementById('headerSiteName').innerText = settings.siteName;
    document.getElementById('heroTitle').innerText = settings.heroTitle;
    document.getElementById('heroDesc').innerText = settings.heroDesc;
    document.getElementById('supportWaLink').href = `https://wa.me/${settings.whatsapp}`;
    document.getElementById('footerText').innerText = `© ${new Date().getFullYear()} ${settings.siteName}`;
    document.documentElement.style.setProperty('--primary', settings.themeColor);
    document.documentElement.style.setProperty('--primary-glow', hexToRgba(settings.themeColor, 0.5));
  }

  function hexToRgba(hex, alpha) {
    let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  // 8. عرض المتجر
  function renderStore() {
    const c = document.getElementById('store-container');
    c.innerHTML = '<div style="text-align:center;"><h2 class="section-title">🛒 المنتجات</h2></div><section class="products" id="prodList"></section>';
    const prodList = document.getElementById('prodList');
    if(products.length === 0) { prodList.innerHTML = '<p style="text-align:center; width:100%; color:var(--text-muted);">لا توجد منتجات حالياً.</p>'; return; }

    products.forEach(p => {
      const isFav = favorites.includes(p.id);
      prodList.innerHTML += `
        <div class="card" data-name="${p.name}" onclick="openProductPage('${p.id}')">
          <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(event, '${p.id}')"><i class="fa-solid fa-heart"></i></button>
          <img src="${p.img}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/748/748137.png'">
          <div class="card-content">
            <h3>${p.name}</h3>
            <button class="details-btn" onclick="event.stopPropagation(); openProductPage('${p.id}')">التفاصيل <i class="fa-solid fa-eye"></i></button>
          </div>
        </div>
      `;
    });
  }

  function toggleFav(e, id) {
    e.stopPropagation();
    const index = favorites.indexOf(id);
    if(index > -1) { favorites.splice(index, 1); showToast('تمت الإزالة', 'success'); } else { favorites.push(id); showToast('تمت الإضافة للمفضلة ❤️', 'success'); }
    localStorage.setItem('THR_favs', JSON.stringify(favorites));
    renderStore();
  }

  function filterProducts() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    document.querySelectorAll('.card').forEach(card => {
      const name = card.getAttribute('data-name').toLowerCase();
      card.style.display = name.includes(query) ? 'flex' : 'none';
    });
  }

  // 9. صفحة المنتج والتقييمات
  function openProductPage(id) {
    activeProduct = products.find(p => String(p.id) === String(id));
    if(!activeProduct) return;
    document.getElementById('pageImg').src = activeProduct.img;
    document.getElementById('pageName').innerText = activeProduct.name;
    document.getElementById('pageDesc').innerText = activeProduct.desc || "لا يوجد وصف.";
    
    const optionsDiv = document.getElementById('pageOptions'); optionsDiv.innerHTML = '';
    selectedOptionIndex = -1; document.getElementById('pageAddBtn').disabled = true;
    
    activeProduct.options.forEach((opt, index) => {
      optionsDiv.innerHTML += `<div class="option-box" id="optBox-${index}" onclick="selectOption(${index}, ${opt.price})"><span class="opt-name">${opt.optName}</span><span class="opt-price">${opt.price} ر.س</span></div>`;
    });

    loadReviews(activeProduct.id);
    document.getElementById('productPage').classList.add('active');
    document.getElementById('productPage').scrollTop = 0;
  }

  function selectOption(index, price) {
    document.querySelectorAll('.option-box').forEach(box => box.classList.remove('selected'));
    document.getElementById(`optBox-${index}`).classList.add('selected');
    selectedOptionIndex = index;
    document.getElementById('pageAddBtn').disabled = false;
    document.getElementById('pageAddBtn').innerHTML = `<i class="fa-solid fa-cart-plus"></i> إضافة - ${price} ر.س`;
  }

  function addToCartFromPage() {
    if(!activeProduct || selectedOptionIndex === -1) return;
    const option = activeProduct.options[selectedOptionIndex];
    const cartItem = { id: activeProduct.id + "-" + selectedOptionIndex, name: activeProduct.name + " - " + option.optName, price: option.price, qty: 1 };
    const existing = cart.find(i => i.id === cartItem.id);
    if(existing) existing.qty++; else cart.push(cartItem);
    updateCart(); showToast('تمت الإضافة للسلة!', 'success'); closeProductPage();
  }

  function closeProductPage() { document.getElementById('productPage').classList.remove('active'); }

  function setRating(val) {
    currentRating = val;
    const stars = document.querySelectorAll('#starRating i');
    stars.forEach((star, index) => { if(index < val) star.classList.add('active'); else star.classList.remove('active'); });
  }

  async function submitReview() {
    if(!activeProduct) return;
    const name = document.getElementById('reviewName').value.trim() || 'عميل مجهول';
    const text = document.getElementById('reviewText').value.trim();
    if(currentRating === 0) return showToast('الرجاء اختيار عدد النجوم', 'warning');
    if(!text) return showToast('الرجاء كتابة تعليق', 'warning');

    const newReview = { productId: activeProduct.id, name: name, rating: currentRating, text: text, date: new Date().toLocaleDateString('ar-SA') };
    
    // حفظ في Firebase
    try {
      const newDocRef = doc(collection(db, "reviews"));
      await setDoc(newDocRef, newReview);
      showToast('تم إضافة تقييمك بنجاح!', 'success');
      document.getElementById('reviewName').value = ''; document.getElementById('reviewText').value = ''; setRating(0);
      await loadDataFromFirebase(); 
      loadReviews(activeProduct.id); 
    } catch (error) {
      showToast("فشل إضافة التقييم", "error");
    }
  }

  function loadReviews(productId) {
    const list = document.getElementById('reviewsList');
    const productReviews = reviews.filter(r => String(r.productId) === String(productId));
    if(productReviews.length === 0) { list.innerHTML = '<p style="color:var(--text-muted); text-align:center;">لا توجد تقييمات بعد.</p>'; return; }
    list.innerHTML = productReviews.map(r => {
      let starsHtml = '';
      for(let i=0; i<5; i++) { starsHtml += i < r.rating ? '<i class="fa-solid fa-star"></i>' : '<i class="fa-regular fa-star"></i>'; }
      return `<div class="review-card"><div class="review-header"><span class="review-name">${r.name}</span><div class="review-stars">${starsHtml}</div></div><p class="review-text">${r.text}</p><small style="color:#555; font-size:10px; margin-top:5px; display:block;">${r.date}</small></div>`;
    }).join('');
  }

  // 10. السلة
  function updateCart() {
    let h = ''; let t = 0;
    cart.forEach(i => { t += i.price * i.qty; h += `<div class="cart-item"><div><strong>${i.name}</strong><br><small style="color:var(--text-muted)">${i.price} ر.س × ${i.qty}</small></div><span class="remove" onclick="removeCart('${i.id}')"><i class="fa-solid fa-trash"></i></span></div>`; });
    document.getElementById('cartItems').innerHTML = h || '<p style="text-align:center; color:var(--text-muted); margin-top:20px;">السلة فارغة</p>';
    document.getElementById('total').innerText = t + ' ر.س';
    document.getElementById('count').innerText = cart.reduce((s,i)=>s+i.qty,0);
    localStorage.setItem('THR_Cart', JSON.stringify(cart));

    const upsellBox = document.getElementById('upsellBox');
    if(settings.upsellProductId && cart.length > 0) {
      const upsellProduct = products.find(p => String(p.id) === String(settings.upsellProductId));
      if(upsellProduct && !cart.some(item => item.id.startsWith(upsellProduct.id + "-"))) {
        upsellBox.style.display = 'block';
        document.getElementById('upsellName').innerText = upsellProduct.name + " - " + upsellProduct.options[0].price + " ر.س";
        upsellBox.setAttribute('data-id', upsellProduct.id);
      } else { upsellBox.style.display = 'none'; }
    } else { upsellBox.style.display = 'none'; }
  }

  function addUpsellToCart() {
    const id = document.getElementById('upsellBox').getAttribute('data-id');
    const p = products.find(prod => String(prod.id) === String(id));
    if(!p) return;
    const opt = p.options[0];
    const cartItem = { id: p.id + "-0", name: p.name + " - " + opt.optName, price: opt.price, qty: 1 };
    const existing = cart.find(i => i.id === cartItem.id);
    if(existing) existing.qty++; else cart.push(cartItem);
    updateCart(); showToast('تمت إضافة العرض!', 'success');
  }

  function removeCart(id) { cart = cart.filter(i => i.id !== id); updateCart(); }
  function toggleCart() { document.getElementById('cartPanel').classList.toggle('open'); }

  function openCheckout() { 
    if(!cart.length) return showToast('السلة فارغة!', 'warning');
    if(!currentUser) { showToast('الرجاء تسجيل الدخول أولاً', 'warning'); document.getElementById('loginModal').classList.add('active'); return; }
    document.getElementById('checkoutModal').classList.add('active'); 
  }

  function processPayment() { 
    document.getElementById('checkoutModal').classList.remove('active'); 
    document.getElementById('deliveryCode').innerText = "CARD-" + Math.floor(Math.random()*10000) + "-" + Math.floor(Math.random()*10000); 
    document.getElementById('successModal').classList.add('active'); 
    cart = []; updateCart(); showToast('تم الشراء بنجاح!', 'success');
  }

  function sendOrderToWhatsApp() {
    if(cart.length === 0) return showToast('السلة فارغة!', 'warning');
    let message = "مرحباً، أرغب بطلب:\n\n"; let total = 0;
    cart.forEach(i => { message += `- ${i.name} (x${i.qty}) = ${i.price * i.qty} ر.س\n`; total += i.price * i.qty; });
    message += `\nالإجمالي: ${total} ر.س\n`;
    if(currentUser) message += `\nإيميل العميل: ${currentUser.email}`;
    window.open(`https://wa.me/${settings.whatsapp}?text=${encodeURIComponent(message)}`, '_blank');
  }

  // 11. تسجيل الدخول
  function updateAuthUI() {
    const authBtn = document.getElementById('authText');
    if(currentUser) { authBtn.innerText = currentUser.email.split('@')[0]; document.getElementById('authButton').style.borderColor = 'var(--success)'; } 
    else { authBtn.innerText = "تسجيل الدخول"; document.getElementById('authButton').style.borderColor = 'rgba(255,255,255,0.1)'; }
  }

  function handleAuthClick() {
    if(currentUser) {
      currentUser = null; localStorage.removeItem('THR_User'); updateAuthUI(); showToast('تم تسجيل الخروج', 'success');
    } else { document.getElementById('loginModal').classList.add('active'); }
  }

  function loginUser() {
    const email = document.getElementById('userEmail').value;
    const pass = document.getElementById('userPass').value;
    if(!email || !pass || !email.includes('@')) return showToast('أدخل بريد إلكتروني صحيح وكلمة مرور', 'error');
    currentUser = { email: email, pass: pass };
    localStorage.setItem('THR_User', JSON.stringify(currentUser));
    document.getElementById('loginModal').classList.remove('active');
    updateAuthUI(); showToast('تم تسجيل الدخول بنجاح!', 'success');
    document.getElementById('userEmail').value = ''; document.getElementById('userPass').value = '';
  }// 12. دخول الإدارة وتأثيرات الماوس
  const logo = document.getElementById('secretLogo');
  let pressTimer;
  logo.addEventListener('mousedown', () => { pressTimer = setTimeout(() => { document.getElementById('loginAdminModal').classList.add('active'); }, 15000); });
  logo.addEventListener('touchstart', () => { pressTimer = setTimeout(() => { document.getElementById('loginAdminModal').classList.add('active'); }, 15000); }, {passive: true});
  logo.addEventListener('mouseup', () => clearTimeout(pressTimer));
  logo.addEventListener('mouseleave', () => clearTimeout(pressTimer));
  logo.addEventListener('touchend', () => clearTimeout(pressTimer));

  // تأثير الإضاءة التفاعلية وتأثير 3D للكروت
  const mouseGlow = document.getElementById('mouseGlow');
  if(mouseGlow) {
    document.addEventListener('mousemove', (e) => {
      mouseGlow.style.opacity = '1';
      mouseGlow.style.left = e.clientX + 'px';
      mouseGlow.style.top = e.clientY + 'px';
    });
    document.addEventListener('mouseleave', () => {
      mouseGlow.style.opacity = '0';
    });
  }

  document.addEventListener('mousemove', (e) => {
    const cards = document.querySelectorAll('.card');
    cards.forEach(card => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      if(x > 0 && x < rect.width && y > 0 && y < rect.height) {
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = ((y - centerY) / centerY) * -10;
        const rotateY = ((x - centerX) / centerX) * 10;
        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
      } else {
        card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)`;
      }
    });
  });

  // 13. لوحة الإدارة (Firebase)
  function checkAdminLogin() {
    const user = document.getElementById('adminUser').value; 
    const pass = document.getElementById('adminPass').value;
    if(user === 'THAMER133' && pass === 'TtHh112233445566') {
      document.getElementById('loginAdminModal').classList.remove('active');
      document.getElementById('adminModal').classList.add('active');
      document.getElementById('setSiteName').value = settings.siteName || '';
      document.getElementById('setHeroTitle').value = settings.heroTitle || '';
      document.getElementById('setHeroDesc').value = settings.heroDesc || '';
      document.getElementById('setThemeColor').value = settings.themeColor || '#8e44ad';
      document.getElementById('setWhatsApp').value = settings.whatsapp || '';
      
      const upsellSelect = document.getElementById('setUpsellProduct');
      upsellSelect.innerHTML = '<option value="">بدون</option>';
      products.forEach(p => { upsellSelect.innerHTML += `<option value="${p.id}" ${settings.upsellProductId == p.id ? 'selected' : ''}>${p.name}</option>`; });
      
      renderAdmin(); renderAdminReviews();
      document.getElementById('adminUser').value = ''; document.getElementById('adminPass').value = '';
      showToast('مرحباً بك في لوحة التحكم', 'success');
    } else { showToast('خطأ في البيانات!', 'error'); }
  }

  function switchTab(tabId) {
    document.querySelectorAll('.admin-tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.admin-tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    if (event && event.target) event.target.classList.add('active');
  }

  async function saveSettings() {
    settings.siteName = document.getElementById('setSiteName').value;
    settings.heroTitle = document.getElementById('setHeroTitle').value;
    settings.heroDesc = document.getElementById('setHeroDesc').value;
    settings.themeColor = document.getElementById('setThemeColor').value;
    settings.whatsapp = document.getElementById('setWhatsApp').value;
    
    try {
      await setDoc(doc(db, "settings", "main"), settings);
      applySettings(); showToast('تم حفظ الإعدادات في قاعدة البيانات!', 'success');
    } catch (error) {
      showToast("فشل حفظ الإعدادات", "error");
    }
  }

  async function saveSmartSettings() {
    settings.upsellProductId = document.getElementById('setUpsellProduct').value || null;
    try {
      await setDoc(doc(db, "settings", "main"), settings);
      updateCart(); showToast('تم الحفظ!', 'success');
    } catch (error) {
      showToast("فشل الحفظ", "error");
    }
  }

  function renderAdmin() {
    let h = '';
    products.forEach(p => {
      let opts = p.options ? p.options.map(o => `<small>${o.optName}: ${o.price}ر.س</small>`).join(' | ') : '';
      h += `<div class="admin-list-item"><div><strong>${p.name}</strong><br>${opts}</div><button onclick="delProduct('${p.id}')" style="color:var(--danger); background:none; border:none; cursor:pointer;"><i class="fa-solid fa-trash"></i></button></div>`
    });
    document.getElementById('adminList').innerHTML = h || '<p style="color:#fff;">لا توجد منتجات.</p>';
  }

  function renderAdminReviews() {
    const list = document.getElementById('adminReviewsList');
    if(reviews.length === 0) { list.innerHTML = '<p style="color:var(--text-muted);">لا توجد تقييمات.</p>'; return; }
    let h = '';
    reviews.forEach(r => {
      const prodName = products.find(p => String(p.id) === String(r.productId))?.name || 'منتج محذوف';
      h += `<div class="admin-list-item" style="flex-direction:column; align-items:flex-start; gap:10px;"><div style="display:flex; justify-content:space-between; width:100%;"><strong>${r.name} - ${prodName}</strong><button onclick="delReview('${r.id}')" style="color:var(--danger); background:none; border:none; cursor:pointer;"><i class="fa-solid fa-trash"></i></button></div><div style="color:#f1c40f;">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div><p style="color:var(--text-muted); font-size:13px;">${r.text}</p></div>`;
    });
    list.innerHTML = h;
  }

  async function delReview(id) {
    try {
      await deleteDoc(doc(db, "reviews", id));
      showToast('تم حذف التقييم', 'success');
      await loadDataFromFirebase();
      renderAdminReviews();
      if(activeProduct) loadReviews(activeProduct.id);
    } catch (error) {
      showToast('فشل الحذف', 'error');
    }
  }

  async function addProductAdmin() {
    const n = document.getElementById('newName').value; 
    const img = document.getElementById('newImg').value || 'https://cdn-icons-png.flaticon.com/512/748/748137.png'; 
    const desc = document.getElementById('newDesc').value;
    const optName1 = document.getElementById('optName1').value; 
    const optPrice1 = parseFloat(document.getElementById('optPrice1').value);
    
    if(!n || !optName1 || !optPrice1) return showToast('أدخل اسم المنتج والخيار الأول', 'error');
    
    let optionsArray = [{ optName: optName1, price: optPrice1 }];
    const optName2 = document.getElementById('optName2').value; 
    const optPrice2 = parseFloat(document.getElementById('optPrice2').value);
    if(optName2 && optPrice2) optionsArray.push({ optName: optName2, price: optPrice2 });
    
    const newProduct = { name: n, desc: desc, img: img, options: optionsArray };

    try {
      const newDocRef = doc(collection(db, "products"));
      await setDoc(newDocRef, newProduct);
      showToast('تمت الإضافة في قاعدة البيانات!', 'success');
      
      // تفريغ الحقول
      document.getElementById('newName').value = ''; document.getElementById('newImg').value = ''; document.getElementById('newDesc').value = ''; document.getElementById('optName1').value = ''; document.getElementById('optPrice1').value = ''; document.getElementById('optName2').value = ''; document.getElementById('optPrice2').value = '';
      
      await loadDataFromFirebase();
      renderAdmin();
    } catch (error) {
      showToast('فشل إضافة المنتج', 'error');
    }
  }

  async function delProduct(id) {
    try {
      await deleteDoc(doc(db, "products", id));
      showToast('تم حذف المنتج!', 'success');
      await loadDataFromFirebase();
      renderAdmin(); 
      renderAdminReviews();
    } catch (error) {
      showToast('فشل حذف المنتج', 'error');
    }
  }

</script>
</body>
</html>
