<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CardStore | المتجر الشامل</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root { 
    --primary: #8e44ad; 
    --primary-dark: #732d91; 
    --success: #00b894; 
    --bg: #121212; 
    --surface: #1e1e1e;
    --text: #f5f6fa; 
    --text-muted: #a4b0be;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
  body { background: var(--bg); color: var(--text); overflow-x: hidden; }
  
  /* Header */
  header { background: var(--surface); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
  .logo { font-size: 26px; font-weight: 900; color: var(--primary); display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; text-shadow: 0 0 10px rgba(142, 68, 173, 0.5);}
  .cart-btn { background: var(--primary); color: #fff; border: none; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; display: flex; align-items: center; gap: 8px;}
  .cart-btn:hover { background: var(--primary-dark); transform: scale(1.05); }
  
  /* Hero */
  .hero { text-align: center; padding: 70px 20px; background: linear-gradient(135deg, #2c3e50, #121212); border-bottom: 2px solid var(--primary); }
  .hero h1 { font-size: 40px; margin-bottom: 15px; font-weight: 900; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
  .hero p { font-size: 18px; color: var(--text-muted); }
  
  /* Products */
  .section-title { max-width: 1200px; margin: 40px auto 10px; padding: 0 25px; font-size: 26px; font-weight: 900; color: var(--text); border-right: 4px solid var(--primary); padding-right: 15px;}
  .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 25px; padding: 20px 25px 40px; max-width: 1200px; margin: auto; }
  .card { background: var(--surface); border-radius: 16px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.4); display: flex; flex-direction: column; transition: 0.3s; border: 1px solid #333; }
  .card:hover { transform: translateY(-8px); border-color: var(--primary); box-shadow: 0 12px 25px rgba(142, 68, 173, 0.3); }
  .card img { width: 100%; height: 150px; object-fit: contain; background: #2a2a2a; padding: 20px; }
  .card-content { padding: 20px; text-align: center; flex-grow: 1; display: flex; flex-direction: column; }
  .card h3 { font-size: 18px; margin-bottom: 10px; font-weight: 700; color: var(--text); }
  .card .price { color: var(--primary); font-weight: 900; font-size: 22px; margin: 10px 0 15px; }
  .card button { margin-top: auto; width: 100%; background: var(--success); color: #fff; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s;}
  .card button:hover { background: #009e7e; transform: scale(1.02); }
  
  /* Cart */
  .cart-panel { position: fixed; top: 0; left: -450px; width: 380px; height: 100%; background: var(--surface); z-index: 200; padding: 25px; transition: 0.4s ease; overflow-y: auto; display: flex; flex-direction: column; box-shadow: 5px 0 25px rgba(0,0,0,0.8); border-right: 1px solid #333;}
  .cart-panel.open { left: 0; }
  .cart-panel h2 { margin-bottom: 20px; color: var(--primary); border-bottom: 2px solid #333; padding-bottom: 15px; display: flex; justify-content: space-between; align-items: center;}
  .close-cart { cursor: pointer; color: #e74c3c; font-size: 22px; }
  .cart-items-container { flex-grow: 1; overflow-y: auto; }
  .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #333; }
  .cart-item .remove { color: #e74c3c; cursor: pointer; padding: 5px; }
  .cart-total { margin-top: 20px; font-size: 22px; font-weight: 900; display: flex; justify-content: space-between; border-top: 2px solid #333; padding-top: 20px; color: var(--text);}
  .checkout { width: 100%; background: var(--primary); color: #fff; border: none; padding: 16px; border-radius: 12px; margin-top: 20px; font-size: 18px; cursor: pointer; font-weight: bold; transition: 0.3s;}
  .checkout:hover { background: var(--primary-dark); }
  
  /* Modals */
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 300; display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
  .modal-overlay.active { display: flex; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal { background: var(--surface); padding: 30px; border-radius: 16px; width: 90%; max-width: 500px; text-align: center; max-height: 90vh; overflow-y: auto; border: 1px solid #444;}
  .modal h3 { color: var(--primary); font-size: 24px; margin-bottom: 20px; }
  .modal input, .modal select { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #444; border-radius: 10px; background: #2a2a2a; color: var(--text); font-family: 'Tajawal'; }
  .modal input:focus { outline: none; border-color: var(--primary); }
  .btn-close { background: var(--success); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.3s;}
  .btn-close:hover { background: #009e7e; }
  .btn-danger { background: #e74c3c; }
  .btn-danger:hover { background: #c0392b; }
  
  /* Admin List */
  .admin-list-item { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 10px 15px; margin-bottom: 8px; border-radius: 8px; font-size: 14px;}
  
  /* Toast */
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--primary); color: white; padding: 15px 25px; border-radius: 10px; z-index: 400; transform: translateY(100px); opacity: 0; transition: 0.3s; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.4);}
  .toast.show { transform: translateY(0); opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="logo" id="secretLogo"><i class="fa-solid fa-bolt"></i> CardStore</div>
  <button class="cart-btn" onclick="toggleCart()"><i class="fa-solid fa-cart-shopping"></i> السلة (<span id="count">0</span>)</button>
</header>

<section class="hero">
  <h1>المتجر الشامل للبطاقات الرقمية</h1>
  <p>تسليم فوري، أسعار منافسة، وأمان تام</p>
</section>

<div id="store-container"></div>

<!-- السلة -->
<div class="cart-panel" id="cartPanel">
  <h2>سلة المشتريات <span class="close-cart" onclick="toggleCart()"><i class="fa-solid fa-xmark"></i></span></h2>
  <div class="cart-items-container" id="cartItems"></div>
  <div class="cart-total"><span>الإجمالي:</span><span id="total">0 ر.س</span></div>
  <button class="checkout" onclick="openCheckout()">إتمام الطلب <i class="fa-solid fa-arrow-left"></i></button>
</div>

<!-- نافذة الدفع -->
<div class="modal-overlay" id="checkoutModal">
  <div class="modal">
    <h3><i class="fa-solid fa-credit-card"></i> إتمام الطلب</h3>
    <input type="text" id="custName" placeholder="الاسم بالكامل">
    <input type="email" id="custEmail" placeholder="البريد الإلكتروني">
    <button class="btn-close" onclick="processPayment()">تأكيد الدفع</button>
  </div>
</div>

<!-- نافذة نجاح الدفع -->
<div class="modal-overlay" id="successModal">
  <div class="modal">
    <h3 style="color:var(--success);"><i class="fa-solid fa-check-circle"></i> تم بنجاح!</h3>
    <p style="margin-bottom: 20px; color: var(--text-muted);">شكراً لك، هذا كود البطاقة الخاص بك:</p>
    <div id="deliveryCode" style="background:#2a2a2a; padding:20px; border-radius:10px; font-family:monospace; font-size:22px; font-weight:bold; margin-bottom:20px; border:2px dashed var(--primary); color: var(--primary);"></div>
    <button class="btn-close" onclick="document.getElementById('successModal').classList.remove('active')">إغلاق</button>
  </div>
</div>

<!-- نافذة تسجيل الدخول -->
<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <h3><i class="fa-solid fa-lock"></i> دخول الإدارة</h3>
    <input type="text" id="adminUser" placeholder="اسم المستخدم">
    <input type="password" id="adminPass" placeholder="كلمة المرور">
    <button class="btn-close" onclick="checkLogin()">دخول</button>
  </div>
</div>

<!-- لوحة الإدارة -->
<div class="modal-overlay" id="adminModal">
  <div class="modal" style="text-align: right;">
    <h3 style="text-align: center;"><i class="fa-solid fa-user-gear"></i> بوابة الإدارة</h3>
    <p style="text-align: center; color: var(--text-muted); margin-bottom: 20px; font-size: 14px;">أضف منتجاتك أو احذفها</p>
    
    <input type="text" id="newName" placeholder="اسم المنتج">
    <input type="number" id="newPrice" placeholder="السعر (ريال)">
    <input type="text" id="newImg" placeholder="رابط الصورة (URL)">
    <button class="btn-close" onclick="addProductAdmin()" style="margin-bottom: 25px;"><i class="fa-solid fa-plus"></i> إضافة المنتج</button>
    
    <h4 style="margin-bottom: 15px; color: var(--primary);">المنتجات الحالية:</h4>
    <div id="adminList" style="max-height: 200px; overflow-y: auto; margin-bottom: 25px;"></div>
    
    <button class="btn-close btn-danger" onclick="logoutAdmin()">تسجيل الخروج</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// بيانات افتراضية (مع صور شغالة 100%)
let categories = JSON.parse(localStorage.getItem('cardStoreData')) || [
  { title: "🎮 شحن الألعاب", items: [
    {id:1, name:"ببجي 660 UC", price:38, img:"https://cdn-icons-png.flaticon.com/512/5988/5988417.png"},
    {id:2, name:"فري فاير 520 جوهرة", price:35, img:"https://cdn-icons-png.flaticon.com/512/7950/7950374.png"}
  ]},
  { title: "🎁 بطاقات الهدايا", items: [
    {id:3, name:"جوجل بلاي 50$", price:185, img:"https://cdn-icons-png.flaticon.com/512/888/888846.png"},
    {id:4, name:"آيتونز 25$", price:98, img:"https://cdn-icons-png.flaticon.com/512/179/179309.png"}
  ]}
];
let cart = [];

// عرض المتجر
function renderStore() {
  const c = document.getElementById('store-container'); c.innerHTML = '';
  categories.forEach(cat => {
    let h = `<h2 class="section-title">${cat.title}</h2><section class="products">`;
    cat.items.forEach(p => {
      // حماية الصورة: لو الرابط خرب، تطلع صورة بديلة
      h += `<div class="card"><img src="${p.img}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/748/748137.png'"><div class="card-content"><h3>${p.name}</h3><div class="price">${p.price} ر.س</div><button onclick="addToCart(${p.id})">أضف للسلة</button></div></div>`;
    });
    c.innerHTML += h + `</section>`;
  });
}

function addToCart(id) {
  let p = null;
  categories.forEach(c => c.items.forEach(i => { if(i.id === id) p = i; }));
  if(!p) return;
  let e = cart.find(i => i.id === id);
  if(e) e.qty++; else cart.push({...p, qty: 1});
  updateCart(); showToast('تمت الإضافة للسلة بنجاح!');
}

function updateCart() {
  let h = ''; let t = 0;
  cart.forEach(i => { 
    t += i.price * i.qty; 
    h += `<div class="cart-item"><div><strong>${i.name}</strong><br><small style="color:var(--text-muted)">${i.price} ر.س × ${i.qty}</small></div><span class="remove" onclick="removeCart(${i.id})"><i class="fa-solid fa-trash"></i></span></div>`; 
  });
  document.getElementById('cartItems').innerHTML = h || '<p style="text-align:center; color:var(--text-muted); margin-top:20px;">السلة فارغة</p>';
  document.getElementById('total').innerText = t + ' ر.س';
  document.getElementById('count').innerText = cart.reduce((s,i)=>s+i.qty,0);
}

function removeCart(id) { cart = cart.filter(i => i.id !== id); updateCart(); }
function toggleCart() { document.getElementById('cartPanel').classList.toggle('open'); }
function openCheckout() { if(!cart.length) return; document.getElementById('checkoutModal').classList.add('active'); }
function processPayment() { 
  if(!document.getElementById('custName').value) return alert('أدخل اسمك');
  document.getElementById('checkoutModal').classList.remove('active'); 
  document.getElementById('deliveryCode').innerText = "CARD-" + Math.floor(Math.random()*10000) + "-" + Math.floor(Math.random()*10000); 
  document.getElementById('successModal').classList.add('active'); 
  cart = []; updateCart(); 
}
function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2500); }

// --- حركة الـ 5 ضغطات ---
let clicks = 0;
document.getElementById('secretLogo').onclick = () => {
  clicks++;
  if(clicks === 5) { 
    document.getElementById('loginModal').classList.add('active'); 
    clicks = 0; 
  }
  setTimeout(() => { clicks = 0; }, 2000); // تصفير العداد لو ما كملت 5 ضغطات بسرعة
};

// --- تسجيل الدخول ---
function checkLogin() {
  const user = document.getElementById('adminUser').value;
  const pass = document.getElementById('adminPass').value;
  
  if(user === 'THAMER133' && pass === 'TtHh112233445566') {
    document.getElementById('loginModal').classList.remove('active');
    document.getElementById('adminModal').classList.add('active');
    renderAdmin();
    document.getElementById('adminUser').value = '';
    document.getElementById('adminPass').value = '';
  } else {
    alert('خطأ في اسم المستخدم أو كلمة المرور!');
  }
}

function logoutAdmin() { document.getElementById('adminModal').classList.remove('active'); }

// --- لوحة الإدارة ---
function renderAdmin() {
  let h = '';
  categories.forEach(c => c.items.forEach(i => h += `<div class="admin-list-item"><span>${i.name} - ${i.price} ر.س</span><button onclick="del(${i.id})" style="color:#e74c3c; background:none; border:none; cursor:pointer; font-size:16px;"><i class="fa-solid fa-trash"></i></button></div>`));
  document.getElementById('adminList').innerHTML = h || '<p style="color:var(--text-muted);">لا توجد منتجات</p>';
}

function addProductAdmin() {
  const n = document.getElementById('newName').value;
  const p = document.getElementById('newPrice').value;
  const img = document.getElementById('newImg').value || 'https://cdn-icons-png.flaticon.com/512/748/748137.png';
  
  if(!n || !p) return alert('أدخل اسم المنتج والسعر');
  
  categories[0].items.push({id: Date.now(), name: n, price: p, img: img});
  localStorage.setItem('cardStoreData', JSON.stringify(categories));
  renderStore(); renderAdmin();
  
  document.getElementById('newName').value = '';
  document.getElementById('newPrice').value = '';
  document.getElementById('newImg').value = '';
  showToast('تم إضافة المنتج بنجاح!');
}

function del(id) {
  if(!confirm('هل تريد حذف هذا المنتج؟')) return;
  categories.forEach(c => c.items = c.items.filter(i => i.id !== id));
  localStorage.setItem('cardStoreData', JSON.stringify(categories));
  renderStore(); renderAdmin();
  showToast('تم الحذف!');
}

// التشغيل
renderStore(); updateCart();
</script>
</body>
</html>
